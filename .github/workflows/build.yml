name: Build Jarvis APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p jarvis && cd jarvis
          mkdir -p app
          cat > app/build.gradle.kts <<'JARVIS_EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.jarvis.app"
              compileSdk = 34
              defaultConfig { applicationId = "com.jarvis.app"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          JARVIS_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.SET_ALARM"/>
          <uses-permission android:name="android.permission.CALL_PHONE"/>
          <uses-permission android:name="android.permission.READ_CONTACTS"/>
          <uses-permission android:name="android.permission.SEND_SMS"/>
          <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES"/>
          <uses-permission android:name="android.permission.READ_CALENDAR"/>
          <uses-permission android:name="android.permission.WRITE_CALENDAR"/>
          <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
          <application android:label="Jarvis" android:theme="@style/T" android:usesCleartextTraffic="false">
          <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <service android:name=".ListenService" android:exported="false" android:foregroundServiceType="microphone"/>
          <service android:name=".JarvisAccess" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
          <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
          <meta-data android:name="android.accessibilityservice" android:resource="@xml/access"/></service>
          </application></manifest>
          JARVIS_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'JARVIS_EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <style>
          :root{--bg:#000;--card:#0d0f12;--line:#1b1f25;--tx:#e8edf2;--mu:#7b8591;--ac:#5ac8fa}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
          canvas{position:fixed;inset:0;width:100%;height:100%}
          .top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 16px;z-index:5}
          .ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(13,15,18,.7);display:flex;align-items:center;justify-content:center;color:var(--tx)}
          .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
          .brand{text-align:center}.brand b{font-size:15px;font-weight:600;letter-spacing:.2em}.brand div{font-size:12px;color:var(--mu);margin-top:2px;font-variant-numeric:tabular-nums}
          #st{position:fixed;bottom:128px;width:100%;text-align:center;font-size:14px;color:var(--mu);letter-spacing:.04em}
          #mic{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:1px solid var(--ac);background:rgba(90,200,250,.1);color:var(--ac);display:flex;align-items:center;justify-content:center;transition:.2s}
          #mic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
          #mic.off{border-color:var(--line);background:var(--card);color:var(--mu)}
          #mic.on{box-shadow:0 0 0 8px rgba(90,200,250,.07),0 0 0 18px rgba(90,200,250,.03)}
          .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:8}.scrim.show{opacity:1;pointer-events:auto}
          .panel{position:fixed;top:0;bottom:0;width:88%;max-width:400px;background:#07080a;z-index:9;display:flex;flex-direction:column;transition:transform .28s ease}
          #hp{left:0;transform:translateX(-102%);border-right:1px solid var(--line)}#sp{right:0;transform:translateX(102%);border-left:1px solid var(--line)}.open{transform:none!important}
          .ph{padding:22px 20px 14px;font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
          .pb{flex:1;overflow:auto;padding:0 16px 24px}
          .msg{margin:10px 0;display:flex}.msg.user{justify-content:flex-end}
          .bub{max-width:86%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line)}
          .user .bub{background:#0f2530;border-color:#17394a}
          .empty{color:var(--mu);font-size:14px;text-align:center;margin-top:40px}
          .sec{font-size:11px;letter-spacing:.12em;color:var(--mu);margin:22px 4px 8px;text-transform:uppercase}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
          input,textarea{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 12px;font:14px system-ui;outline:none}
          input:focus,textarea:focus{border-color:var(--ac)}
          .row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
          .btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#12161b;color:var(--tx);font:14px system-ui;margin-top:10px}
          .btn.p{background:var(--ac);color:#001018;border-color:var(--ac);font-weight:600}.btn.d{color:#ff6b6b}
          .sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0}
          .sw i{position:absolute;inset:0;border-radius:13px;background:#242a31;transition:.2s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
          .sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{transform:translateX(20px)}
          .seg{display:flex;background:#000;border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{flex:1;padding:9px;border:0;background:none;color:var(--mu);border-radius:8px;font:14px system-ui}.seg button.a{background:#1a2027;color:var(--tx)}
          .chip{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px}.chip span{color:var(--mu)}
          #gate{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;justify-content:center;padding:28px}
          #gate h1{font-size:28px;margin:0 0 8px}#gate p{color:var(--mu);font-size:14px;line-height:1.5;margin:0 0 22px}
          </style></head><body>
          <canvas id="c"></canvas>
          <div class="top">
          <button class="ib" onclick="tg('hp')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button>
          <div class="brand"><b>JARVIS</b><div id="clock"></div></div>
          <button class="ib" onclick="tg('sp')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
          </div>
          <div id="st"></div>
          <button id="mic" onclick="micT()"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <div class="scrim" id="sc" onclick="tg()"></div>

          <div class="panel" id="hp"><div class="ph">History</div><div class="pb"><div id="hl"></div><button class="btn d" onclick="Android.clearHist();renderHist([])">Clear history</button></div></div>

          <div class="panel" id="sp"><div class="ph">Settings</div><div class="pb">
          <div class="sec">Voice</div><div class="card">
          <div class="row"><div>Wake word<small>Say “Jarvis” before a command</small></div><label class="sw"><input type="checkbox" id="wk" onchange="save()"><i></i></label></div>
          <div class="sec" style="margin:16px 0 8px">Language</div>
          <div class="seg" id="lg"><button data-v="hi-IN" onclick="setLg('hi-IN')">Hindi</button><button data-v="en-IN" onclick="setLg('en-IN')">English</button></div></div>
          <div class="sec">Assistant</div><div class="card"><textarea id="pe" rows="4" placeholder="Name, personality, how Jarvis should talk to you…" onchange="save()"></textarea></div>
          <div class="sec">API key</div><div class="card"><input id="k" type="password" placeholder="New Gemini API key"><button class="btn" onclick="if(k.value.trim()){Android.saveKey(k.value);k.value='';this.textContent='Saved ✓'}">Update key</button></div>
          <div class="sec">Device control</div><div class="card"><div class="row"><div>Accessibility access<small>Needed for home, back, tap, scroll</small></div></div><button class="btn" onclick="Android.openAccess()">Open accessibility settings</button></div>
          <div class="sec">Memory</div><div id="ml"></div><button class="btn d" onclick="Android.clearMem();renderMem()">Clear all memory</button>
          </div></div>

          <div id="gate"><h1>Welcome</h1><p>Enter your Google Gemini API key to start. It is stored on this device and asked only once.</p>
          <input id="gk" type="password" placeholder="Gemini API key"><button class="btn p" onclick="if(gk.value.trim()){Android.saveKey(gk.value);gate.style.display='none'}">Continue</button></div>
          <script>
          const $=id=>document.getElementById(id);let S=JSON.parse(Android.state()),lang=S.lang;
          function tg(i){['hp','sp'].forEach(x=>$(x).classList.toggle('open',x==i&&!$(x).classList.contains('open')));$('sc').classList.toggle('show',!!i&&$(i).classList.contains('open'))}
          function renderHist(h){const b=$('hl');b.innerHTML=h.length?'':'<div class="empty">No conversations yet</div>';h.forEach(m=>add(m.r,m.t))}
          function add(r,t){const e=$('hl').querySelector('.empty');if(e)e.remove();const d=document.createElement('div');d.className='msg '+(r=='user'?'user':'');d.innerHTML='<div class="bub"></div>';d.firstChild.textContent=t;$('hl').appendChild(d)}
          function addHist(r,t){add(r,t)}
          function renderMem(){S=JSON.parse(Android.state());const b=$('ml');b.innerHTML=S.mem.length?'':'<div class="empty" style="margin:10px 0 14px">Nothing remembered yet</div>';S.mem.forEach((m,i)=>{const d=document.createElement('div');d.className='chip';d.innerHTML='<div></div><span>✕</span>';d.firstChild.textContent=m;d.onclick=()=>{Android.delMem(i);renderMem()};b.appendChild(d)})}
          function memChanged(){renderMem()}
          function setLg(v){lang=v;mark();save()}function mark(){document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('a',b.dataset.v==lang))}
          function save(){Android.saveSettings($('pe').value,lang,$('wk').checked)}
          renderHist(S.hist);renderMem();$('pe').value=S.persona;$('wk').checked=S.wake;mark();
          if(!S.hasKey)$('gate').style.display='flex';
          const names={listening:'Listening…',wake:'Say “Jarvis”',thinking:'Thinking…',speaking:'Speaking…',off:'Microphone off'};
          function status(s){$('st').textContent=names[s];const on=s!='off';$('mic').className=on?'on':'off'}
          status(S.mic?'listening':'off');
          function micT(){Android.mic($('mic').classList.contains('off'))}
          setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
          let lv=0,tl=0;function level(v){tl=Math.max(0,Math.min(1,(v+2)/12))}
          const cv=$('c'),x=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}rs();onresize=rs;
          const P=[];for(let i=0;i<650;i++){const y=1-2*(i+.5)/650,r=Math.sqrt(1-y*y),a=i*2.39996;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
          let t=0;(function f(){t+=.005;lv+=(tl-lv)*.25;tl*=.9;x.clearRect(0,0,W,H);
          const d=devicePixelRatio,R=Math.min(W,H)*.27*(1+lv*.12),cx=W/2,cy=H*.46,c=Math.cos(t),s=Math.sin(t);
          for(const q of P){const X=q[0]*c+q[2]*s,Z=-q[0]*s+q[2]*c,Y=q[1],k=(Z+1)/2,j=1+lv*.06*Math.sin(q[0]*8+t*25);
          x.fillStyle=`rgba(${150+k*60|0},${215+k*30|0},255,${.12+k*.78})`;x.beginPath();x.arc(cx+X*R*j,cy+Y*R*j,(.8+k*1.5)*d,0,7);x.fill()}
          requestAnimationFrame(f)})();
          </script></body></html>
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/JarvisAccess.kt <<'JARVIS_EOF'
          package com.jarvis.app
          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.*
          class JarvisAccess : AccessibilityService() {
              companion object { var i: JarvisAccess? = null }
              override fun onServiceConnected() { i = this }
              override fun onUnbind(x: Intent?): Boolean { i = null; return super.onUnbind(x) }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              fun tap(text: String): Boolean {
                  val r = rootInActiveWindow ?: return false
                  for (n in r.findAccessibilityNodeInfosByText(text)) {
                      var c: AccessibilityNodeInfo? = n
                      while (c != null) { if (c.isClickable) { c.performAction(AccessibilityNodeInfo.ACTION_CLICK); return true }; c = c.parent }
                  }
                  return false
              }
              private fun scrollable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (k in 0 until n.childCount) scrollable(n.getChild(k))?.let { return it }
                  return null
              }
              fun scroll(fwd: Boolean) {
                  scrollable(rootInActiveWindow)?.performAction(if (fwd) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)
              }
              fun typeText(t: String) {
                  val f = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return
                  f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, t) })
              }
          }
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/ListenService.kt <<'JARVIS_EOF'
          package com.jarvis.app
          import android.app.*
          import android.content.Intent
          import android.os.IBinder
          class ListenService : Service() {
              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "j").setContentTitle("Jarvis sun raha hai")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  startForeground(1, n)
                  return START_STICKY
              }
          }
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/MainActivity.kt <<'JARVIS_EOF'
          package com.jarvis.app
          import android.Manifest
          import android.app.Activity
          import android.content.*
          import android.content.pm.PackageManager
          import android.content.pm.ResolveInfo
          import android.net.Uri
          import android.os.*
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import android.hardware.camera2.*
          import android.media.AudioManager
          import android.telephony.SmsManager
          import android.view.KeyEvent
          import android.provider.CalendarContract
          import android.speech.*
          import android.speech.tts.*
          import android.webkit.*
          import org.json.*
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.*

          class MainActivity : Activity() {
              lateinit var web: WebView
              lateinit var p: SharedPreferences
              var sr: SpeechRecognizer? = null
              var tts: TextToSpeech? = null
              var micOn = false; var speaking = false; var busy = false
              val h = Handler(Looper.getMainLooper())

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  p = getSharedPreferences("j", MODE_PRIVATE)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.setBackgroundColor(0)
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.loadUrl("file:///android_asset/index.html")
                  setContentView(web)
                  tts = TextToSpeech(this) { }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS, Manifest.permission.CALL_PHONE, Manifest.permission.READ_CONTACTS, Manifest.permission.SEND_SMS), 1)
                  else startMic()
              }
              override fun onRequestPermissionsResult(c: Int, ps: Array<out String>, r: IntArray) { if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) startMic() }

              fun js(s: String) = h.post { web.evaluateJavascript(s, null) }
              fun arr(k: String) = JSONArray(p.getString(k, "[]"))

              fun startMic() {
                  micOn = true
                  startForegroundService(Intent(this, ListenService::class.java))
                  js("status('" + idle() + "')"); listen()
              }
              fun stopMic() { micOn = false; h.post { sr?.destroy(); sr = null }; stopService(Intent(this, ListenService::class.java)); js("status('off')") }

              var activeUntil = 0L
              fun idle() = if (p.getBoolean("wake", true) && System.currentTimeMillis() > activeUntil) "wake" else "listening"
              fun route(t: String?) {
                  if (t.isNullOrBlank()) { listen(); return }
                  if (!p.getBoolean("wake", true)) { ask(t); return }
                  val re = Regex("(jarvis|jarvish|jarwis|jervis|जार्विस|जार्विश|जर्विस|जारविस|जार्विज)", RegexOption.IGNORE_CASE)
                  if (re.containsMatchIn(t)) {
                      val cmd = t.replace(re, "").trim(' ', ',', '.', '!', '?', '।')
                      if (cmd.length < 2) speak("Ji, boliye.") else ask(cmd)
                  } else if (System.currentTimeMillis() < activeUntil) ask(t)
                  else { js("status('wake')"); listen() }
              }

              fun listen() {
                  if (!micOn || speaking || busy) return
                  h.post {
                      sr?.destroy()
                      sr = SpeechRecognizer.createSpeechRecognizer(this)
                      sr!!.setRecognitionListener(object : RecognitionListener {
                          override fun onResults(r: Bundle?) {
                              val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              route(t)
                          }
                          override fun onError(e: Int) { h.postDelayed({ listen() }, 500) }
                          override fun onRmsChanged(v: Float) { js("level($v)") }
                          override fun onReadyForSpeech(b: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(b: Bundle?) {}
                          override fun onEvent(t: Int, b: Bundle?) {}
                      })
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, p.getString("lang", "hi-IN"))
                      sr!!.startListening(i)
                  }
              }

              fun addHist(role: String, text: String) {
                  val a = arr("hist"); a.put(JSONObject().put("r", role).put("t", text))
                  val n = JSONArray(); for (i in maxOf(0, a.length() - 200) until a.length()) n.put(a.get(i))
                  p.edit().putString("hist", n.toString()).apply()
                  js("addHist(${JSONObject.quote(role)},${JSONObject.quote(text)})")
              }

              fun ask(text: String) {
                  busy = true; js("status('thinking')"); addHist("user", text)
                  Thread {
                      var out = JSONObject().put("say", "Network ya API key mein dikkat hai.").put("action", "none")
                      try {
                          val hist = arr("hist"); val contents = JSONArray()
                          for (i in maxOf(0, hist.length() - 12) until hist.length()) {
                              val o = hist.getJSONObject(i)
                              contents.put(JSONObject().put("role", if (o.getString("r") == "user") "user" else "model")
                                  .put("parts", JSONArray().put(JSONObject().put("text", o.getString("t")))))
                          }
                          val sys = "You are Jarvis, a personal voice assistant. Speak Hindi or English matching the user (Hinglish ok). Keep replies short and spoken-friendly. " +
                              "Persona/instructions from user: ${p.getString("persona", "")}\nMemory facts: ${arr("mem")}\nNow: ${Date()}\n" +
                              "Reply ONLY JSON: {\"say\":string,\"action\":string,\"arg\":string,\"remember\":string}. Actions and arg: none; open_app(app name); uninstall(app name); alarm(HH:MM 24h); timer(seconds); calendar(title); search(query); youtube(query, also for playing songs/videos); maps(place); url(link); camera; " +
                              "call(name or number); sms(name or number|text); whatsapp(name or number|text, sends it); email(to|subject|body); flashlight(on|off); volume(up|down|mute|max|0-100); brightness(0-100); media(play|pause|next|prev); " +
                              "settings(wifi|bluetooth|airplane|location|hotspot|battery|display|sound|apps|storage|date|accessibility); battery (reports level); " +
                              "home; back; recents; notifications; quick_settings; lock; screenshot; tap(visible text/button on screen); scroll(down|up); type(text into focused field). " +
                              "remember: a new durable fact about the user or empty. For several steps use only the main action."
                          val body = JSONObject().put("contents", contents)
                              .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sys))))
                              .put("generationConfig", JSONObject().put("responseMimeType", "application/json"))
                          val c = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + p.getString("key", "")).openConnection() as HttpURLConnection
                          c.requestMethod = "POST"; c.doOutput = true; c.setRequestProperty("Content-Type", "application/json")
                          c.outputStream.write(body.toString().toByteArray())
                          val res = (if (c.responseCode == 200) c.inputStream else c.errorStream).bufferedReader().readText()
                          val t = JSONObject(res).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          out = JSONObject(t)
                      } catch (e: Exception) {}
                      h.post { handle(out) }
                  }.start()
              }

              fun handle(o: JSONObject) {
                  val say = o.optString("say"); val arg = o.optString("arg"); val rem = o.optString("remember")
                  if (rem.isNotBlank()) { val m = arr("mem"); m.put(rem); p.edit().putString("mem", m.toString()).apply(); js("memChanged()") }
                  val ex = try { act(o.optString("action"), arg) } catch (e: Exception) { "" }
                  val full = (say + " " + ex).trim()
                  addHist("jarvis", full); speak(full)
              }

              fun findApp(n: String): ResolveInfo? {
                  val pm = packageManager
                  val l = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  return l.firstOrNull { it.loadLabel(pm).toString().equals(n, true) } ?: l.firstOrNull { it.loadLabel(pm).toString().contains(n, true) }
              }
              fun phone(q: String): String {
                  val d = q.filter { it.isDigit() }
                  if (d.length >= 7) return if (d.length == 10) "91$d" else d
                  val c = contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER),
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?", arrayOf("%$q%"), null)
                  c?.use { if (it.moveToFirst()) { val n = it.getString(0).filter { ch -> ch.isDigit() }; return if (n.length == 10) "91$n" else n } }
                  return ""
              }
              fun act(a: String, arg: String): String {
                  fun go(i: Intent) = startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  val acc = JarvisAccess.i
                  fun needAcc(f: (JarvisAccess) -> Unit): String {
                      if (acc == null) { go(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)); return "Pehle Settings me Jarvis ka accessibility access on karo." }
                      f(acc); return ""
                  }
                  when (a) {
                      "open_app" -> findApp(arg)?.let { go(packageManager.getLaunchIntentForPackage(it.activityInfo.packageName)!!) }
                      "uninstall" -> findApp(arg)?.let { go(Intent(Intent.ACTION_DELETE, Uri.parse("package:" + it.activityInfo.packageName))) }
                      "alarm" -> { val (hh, mm) = arg.split(":").map { it.trim().toInt() }
                          go(Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR, hh).putExtra(AlarmClock.EXTRA_MINUTES, mm).putExtra(AlarmClock.EXTRA_SKIP_UI, true)) }
                      "timer" -> go(Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, arg.trim().toInt()).putExtra(AlarmClock.EXTRA_SKIP_UI, true))
                      "calendar" -> go(Intent(Intent.ACTION_INSERT).setData(CalendarContract.Events.CONTENT_URI).putExtra(CalendarContract.Events.TITLE, arg))
                      "search" -> go(Intent(Intent.ACTION_WEB_SEARCH).putExtra("query", arg))
                      "youtube" -> go(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(arg))))
                      "maps" -> go(Intent(Intent.ACTION_VIEW, Uri.parse("google.navigation:q=" + Uri.encode(arg))))
                      "url" -> go(Intent(Intent.ACTION_VIEW, Uri.parse(arg)))
                      "camera" -> go(Intent(MediaStore.ACTION_IMAGE_CAPTURE))
                      "call" -> { val n = phone(arg).ifEmpty { arg }
                          if (checkSelfPermission(Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) go(Intent(Intent.ACTION_CALL, Uri.parse("tel:+$n"))) else go(Intent(Intent.ACTION_DIAL, Uri.parse("tel:$n"))) }
                      "sms" -> { val (w, t) = arg.split("|", limit = 2); val n = phone(w)
                          if (n.isEmpty()) return "Number nahi mila."
                          @Suppress("DEPRECATION") SmsManager.getDefault().sendTextMessage("+$n", null, t, null, null) }
                      "whatsapp" -> { val (w, t) = arg.split("|", limit = 2); val n = phone(w)
                          if (n.isEmpty()) return "Number nahi mila."
                          go(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/$n?text=" + Uri.encode(t))))
                          h.postDelayed({ JarvisAccess.i?.tap("Send") }, 3000) }
                      "email" -> { val p3 = arg.split("|"); go(Intent(Intent.ACTION_SENDTO, Uri.parse("mailto:" + p3[0])).putExtra(Intent.EXTRA_SUBJECT, p3.getOrElse(1) { "" }).putExtra(Intent.EXTRA_TEXT, p3.getOrElse(2) { "" })) }
                      "flashlight" -> { val cm = getSystemService(CAMERA_SERVICE) as CameraManager
                          val id = cm.cameraIdList.first { cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true }
                          cm.setTorchMode(id, !arg.contains("off", true)) }
                      "volume" -> { val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                          when (arg.lowercase()) {
                              "up" -> am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                              "down" -> am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                              "mute" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                              "max" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, max, AudioManager.FLAG_SHOW_UI)
                              else -> am.setStreamVolume(AudioManager.STREAM_MUSIC, max * arg.trim().toInt().coerceIn(0, 100) / 100, AudioManager.FLAG_SHOW_UI)
                          } }
                      "brightness" -> if (Settings.System.canWrite(this)) {
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, 0)
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, arg.trim().toInt().coerceIn(0, 100) * 255 / 100)
                      } else { go(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName"))); return "Brightness permission allow karo, phir dobara bolo." }
                      "media" -> { val k = when (arg.lowercase()) { "next" -> KeyEvent.KEYCODE_MEDIA_NEXT; "prev" -> KeyEvent.KEYCODE_MEDIA_PREVIOUS; "pause" -> KeyEvent.KEYCODE_MEDIA_PAUSE; else -> KeyEvent.KEYCODE_MEDIA_PLAY }
                          am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, k)); am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, k)) }
                      "settings" -> go(when (arg.lowercase()) {
                          "wifi" -> Intent(Settings.Panel.ACTION_WIFI)
                          "bluetooth" -> Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                          "airplane" -> Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS)
                          "location" -> Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
                          "hotspot" -> Intent(Settings.ACTION_WIRELESS_SETTINGS)
                          "battery" -> Intent(Intent.ACTION_POWER_USAGE_SUMMARY)
                          "display" -> Intent(Settings.ACTION_DISPLAY_SETTINGS)
                          "sound" -> Intent(Settings.ACTION_SOUND_SETTINGS)
                          "apps" -> Intent(Settings.ACTION_APPLICATION_SETTINGS)
                          "storage" -> Intent(Settings.ACTION_INTERNAL_STORAGE_SETTINGS)
                          "date" -> Intent(Settings.ACTION_DATE_SETTINGS)
                          "accessibility" -> Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          else -> Intent(Settings.ACTION_SETTINGS) })
                      "battery" -> { val b = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))!!
                          return "Battery " + b.getIntExtra("level", 0) * 100 / b.getIntExtra("scale", 100) + " percent hai." }
                      "home" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_HOME) }
                      "back" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_BACK) }
                      "recents" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_RECENTS) }
                      "notifications" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS) }
                      "quick_settings" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS) }
                      "lock" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN) }
                      "screenshot" -> return needAcc { it.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT) }
                      "tap" -> return needAcc { if (!it.tap(arg)) speakExtra = "Screen par '$arg' nahi mila." }.ifEmpty { speakExtra.also { speakExtra = "" } }
                      "scroll" -> return needAcc { it.scroll(arg != "up") }
                      "type" -> return needAcc { it.typeText(arg) }
                  }
                  return ""
              }
              var speakExtra = ""

              fun speak(t: String) {
                  speaking = true; js("status('speaking')")
                  val hi = t.any { it in '\u0900'..'\u097F' }
                  tts?.language = if (hi) Locale("hi", "IN") else Locale("en", "IN")
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onError(id: String?) { done() }
                      override fun onDone(id: String?) { done() }
                      fun done() { speaking = false; busy = false; activeUntil = System.currentTimeMillis() + 10000; js("status('" + idle() + "')"); listen() }
                  })
                  tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u")
              }

              inner class Bridge {
                  @JavascriptInterface fun state(): String = JSONObject().put("hasKey", p.getString("key", "")!!.isNotEmpty())
                      .put("persona", p.getString("persona", "")).put("lang", p.getString("lang", "hi-IN")).put("wake", p.getBoolean("wake", true))
                      .put("mem", arr("mem")).put("hist", arr("hist")).put("mic", micOn).toString()
                  @JavascriptInterface fun saveKey(k: String) { p.edit().putString("key", k.trim()).apply() }
                  @JavascriptInterface fun saveSettings(persona: String, lang: String, wake: Boolean) { p.edit().putString("persona", persona).putString("lang", lang).putBoolean("wake", wake).apply(); js("status('" + idle() + "')") }
                  @JavascriptInterface fun mic(on: Boolean) = h.post { if (on) startMic() else stopMic() }
                  @JavascriptInterface fun openAccess() { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  @JavascriptInterface fun clearHist() { p.edit().putString("hist", "[]").apply() }
                  @JavascriptInterface fun clearMem() { p.edit().putString("mem", "[]").apply() }
                  @JavascriptInterface fun delMem(i: Int) { val a = arr("mem"); a.remove(i); p.edit().putString("mem", a.toString()).apply() }
              }
              override fun onDestroy() { sr?.destroy(); tts?.shutdown(); super.onDestroy() }
          }
          JARVIS_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'JARVIS_EOF'
          <resources><string name="acc_desc">Jarvis ko home, back, tap, scroll, screenshot jaise phone control commands chalane deta hai.</string></resources>
          JARVIS_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'JARVIS_EOF'
          <resources><style name="T" parent="android:Theme.Material.NoActionBar">
          <item name="android:windowBackground">@android:color/black</item>
          <item name="android:statusBarColor">@android:color/black</item>
          <item name="android:navigationBarColor">@android:color/black</item></style></resources>
          JARVIS_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/access.xml <<'JARVIS_EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
           android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric"
           android:canRetrieveWindowContent="true" android:canPerformGestures="true" android:accessibilityFlags="flagRetrieveInteractiveWindows"
           android:description="@string/acc_desc" android:notificationTimeout="100"/>
          JARVIS_EOF
          cat > build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JARVIS_EOF
          cat > gradle.properties <<'JARVIS_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          JARVIS_EOF
          cat > settings.gradle.kts <<'JARVIS_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Jarvis"
          include(":app")
          JARVIS_EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
        working-directory: jarvis
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
